name: topthreadz-backend
type: web
service:
  name: topthreadz-backend
  git:
    repository: github.com/MateenMureed/topthreadz
    branch: main
    workdir: backend
  build:
    command: npm install && npm run build
  run:
    command: npx prisma migrate deploy && npm start
  ports:
    - port: 8000
      path: /
  routes:
    - path: /
      port: 8000
  env:
    - key: NODE_ENV
      value: production
    - key: PORT
      value: "8000"
    - key: CLOUDINARY_CLOUD_NAME
      value: fmxzphak
    - key: CLOUDINARY_API_KEY
      value: "156739432955889"
    - key: CLOUDINARY_API_SECRET
      value: 3QTZa7lYyeG9DFjVLtFu784Bya0
